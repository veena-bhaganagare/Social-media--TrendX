<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrendX — Your space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="8" cy="30" r="4" fill="#2F5FFF"/><circle cx="20" cy="12" r="4" fill="#15181F"/><circle cx="33" cy="26" r="4" fill="#2F5FFF"/><path d="M8 30L20 12L33 26" stroke="#2F5FFF" stroke-width="2"/></svg>
    TrendX
  </a>
  <button class="ghost-btn" id="sign-out" type="button">Sign out</button>
</header>

<main class="home-shell">
  <p class="eyebrow">Your space</p>
  <h1 id="greeting">Welcome</h1>
  <p>This is a placeholder for your personalized feed. Here's what you're following:</p>
  <div class="pill-list" id="pill-list"></div>
  <button class="ghost-btn" id="edit-interests" type="button">Edit interests</button>
  <button class="ghost-btn" id="open-dashboard" type="button">Open dashboard</button>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var TX = window.TrendX;

  // Wait for Firebase to report who's signed in before rendering.
  TX.once(function (user) {
    if (!user) { window.location.href = "index.html"; return; }

    document.getElementById("greeting").textContent = "Welcome, " + user.name.split(" ")[0];

    var list = document.getElementById("pill-list");
    var topics = user.interests || [];
    if (!topics.length) {
      var p = document.createElement("span");
      p.textContent = "No topics selected yet";
      list.appendChild(p);
    } else {
      topics.forEach(function (t) {
        var s = document.createElement("span");
        s.textContent = t;
        list.appendChild(s);
      });
    }
  });

  document.getElementById("edit-interests").onclick = function () {
    window.location.href = "interests.html";
  };
  document.getElementById("open-dashboard").onclick = function () {
    window.location.href = "dashboard.html";
  };
  document.getElementById("sign-out").onclick = function () {
    TX.signOut().then(function () { window.location.href = "index.html"; });
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrendX — Choose what you want to follow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="8" cy="30" r="4" fill="#2F5FFF"/><circle cx="20" cy="12" r="4" fill="#15181F"/><circle cx="33" cy="26" r="4" fill="#2F5FFF"/><path d="M8 30L20 12L33 26" stroke="#2F5FFF" stroke-width="2"/></svg>
    TrendX
  </a>
</header>

<main class="interests-shell">

  <div class="interests-head">
    <p class="eyebrow">Your personal starting point</p>
    <h1>Choose what you want to follow.</h1>
    <p>Select the topics you care about. TrendX will turn them into a more relevant intelligence feed.</p>
  </div>

  <div class="tabs-row" id="tabs-row" role="tablist" aria-label="Categories"></div>

  <div class="toolbar">
    <div class="count-line"><b id="count">0</b> selected · Choose at least 3</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="search" placeholder="Search interests" aria-label="Search interests">
    </div>
  </div>

  <div class="chip-grid" id="chip-grid" role="group" aria-label="Interests"></div>

  <div class="bottom-bar">
    <button class="skip-link" id="skip" type="button">Skip for now</button>
    <button class="continue-btn" id="continue" type="button" disabled>Continue →</button>
  </div>

</main>

<div class="toast" id="toast" role="status"></div>

<script src="js/interests.js"></script>
</body>
</html>
